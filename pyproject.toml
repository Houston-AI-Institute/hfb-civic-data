[project]
name = "hfb"
version = "0.1.0"
description = "ZCTA-level civic participation reference table for a Houston-area food bank"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas",
    "geopandas",
    "pyogrio",
    "numpy",
    "openpyxl",
    "matplotlib",
    "pyarrow",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hfb"]

[tool.pytest.ini_options]
addopts = "-m 'not real'"
markers = ["real: needs data/raw"]
testpaths = ["tests"]
